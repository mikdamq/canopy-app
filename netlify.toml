# Netlify settings for Lamina. Netlify detects Next.js and adds its Next.js runtime
# automatically; this file only pins the build so the dashboard can't drift.
# Environment variables (secrets included) live in the Netlify dashboard, never here:
# see docs/accounts-setup.md, phase 3.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
